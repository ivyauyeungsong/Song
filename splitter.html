<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>千愛歌譜 分批處理 0.19 ZIP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{font-family:-apple-system,sans-serif;margin:0;padding:16px;background:#f5f7fa;color:#111}
h1{font-size:22px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
button{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:600;margin-top:10px}
.primary{background:#007aff;color:#fff}
.secondary{background:#e9eef5;color:#111}
.danger{background:#ffe5e5;color:#b00020}
input,select{width:100%;padding:12px;margin-top:8px;border:1px solid #ccc;border-radius:10px;font-size:16px;box-sizing:border-box}
.status{margin-top:10px;font-size:14px;color:#444;white-space:pre-wrap}
.small{font-size:13px;color:#666}
.hidden{display:none}
</style>
</head>
<body>

<h1>千愛歌譜 分批處理 0.19</h1>
<div class="small">一次匯出成一個 ZIP：library.json + 全部 PDF</div>

<div class="card">
  <label>選擇 library.json</label>
  <input type="file" id="jsonFile" accept=".json">
  <div class="status" id="jsonStatus">尚未選擇 JSON</div>
</div>

<div class="card">
  <label>選擇 PDF 資料夾</label>
  <input type="file" id="pdfFolder" webkitdirectory multiple>
  <div class="status" id="pdfStatus">尚未選擇 PDF</div>
</div>

<div class="card">
  <button class="primary" id="exportBtn">匯出 ZIP</button>
  <button class="secondary hidden" id="resetBtn">重新開始</button>
  <div class="status" id="status">準備就緒</div>
</div>

<script>
const $=id=>document.getElementById(id);
let songs=[],pdfMap=new Map();

$('jsonFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return;
  $('jsonStatus').textContent='讀取中...';
  try{
    const text=await f.text();
    const data=JSON.parse(text);
    songs=Array.isArray(data)?data:(data.songs||data.data||[]);
    $('jsonStatus').textContent=`已載入 ${songs.length} 首歌`;
  }catch(err){
    $('jsonStatus').textContent='JSON 讀取失敗：'+err.message;
  }
});

$('pdfFolder').addEventListener('change',e=>{
  pdfMap.clear();
  for(const f of e.target.files){
    if(f.name.toLowerCase().endsWith('.pdf')) pdfMap.set(f.name,f);
  }
  $('pdfStatus').textContent=`已選擇 ${pdfMap.size} 個 PDF`;
});

$('exportBtn').addEventListener('click',async()=>{
  if(!songs.length){alert('請先選擇 library.json');return;}
  if(!pdfMap.size){alert('請先選擇 PDF 資料夾');return;}

  $('exportBtn').disabled=true;
  $('status').textContent='建立 ZIP 中...';

  try{
    const zip=new JSZip();
    zip.file('library.json',JSON.stringify(songs,null,2));
    const pdfFolder=zip.folder('pdf');

    let done=0;
    for(const song of songs){
      const title=song.title||song.name||song.id||('song-'+(done+1));
      const safe=title.replace(/[\\/:*?"<>|]/g,'_').trim();
      const file=pdfMap.get(song.pdfFile)||pdfMap.get(song.pdf)||pdfMap.get(song.filename);

      if(file){
        pdfFolder.file(`${safe}.pdf`,await file.arrayBuffer());
      }else{
        console.warn('找不到 PDF：',song);
      }

      done++;
      $('status').textContent=`加入 PDF ${done}/${songs.length}`;
    }

    $('status').textContent='壓縮 ZIP 中，請勿關閉頁面...';
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});

    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='song-library.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),10000);

    $('status').textContent=`完成！已下載 song-library.zip，共 ${done} 首歌。`;
    $('resetBtn').classList.remove('hidden');
  }catch(err){
    $('status').textContent='匯出失敗：'+err.message;
    console.error(err);
  }finally{
    $('exportBtn').disabled=false;
  }
});

$('resetBtn').addEventListener('click',()=>{
  songs=[];pdfMap.clear();
  $('jsonFile').value='';$('pdfFolder').value='';
  $('jsonStatus').textContent='尚未選擇 JSON';
  $('pdfStatus').textContent='尚未選擇 PDF';
  $('status').textContent='準備就緒';
  $('resetBtn').classList.add('hidden');
});
</script>

</body>
</html>
