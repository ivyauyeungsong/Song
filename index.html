<!doctype html><html lang="zh-Hant" manifest="offline.manifest"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>千愛歌譜 0.17</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f3f6fb;color:#17233a;font:19px Arial,sans-serif}header{background:linear-gradient(120deg,#6a3df5,#0090ff 55%,#00c2a8);color:#fff;padding:10px 12px 12px}main{max-width:1100px;margin:auto;padding:12px}h1{margin:0;font-size:24px;display:flex;align-items:baseline;gap:8px}.ver{font-size:13px;opacity:.85;font-weight:normal}#toprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}#toprow .spacer{flex:1}button,input,select{font:inherit;background:#fff;color:#17233a;border:1px solid #c9d4e4;border-radius:10px;padding:9px 12px;max-width:100%}button{cursor:pointer;box-shadow:0 1px 3px rgba(20,40,80,.15)}#search{width:100%;margin-top:10px;padding:12px;border-radius:12px;font-size:19px}#cats,#people{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}#cats button{background:#fff;color:#4b3ba8;border-color:#d9d2ff}#people button{background:#fff;color:#0b6f8f;border-color:#c8ecf5}#cats .on{background:#6a3df5;color:#fff;border-color:#6a3df5}#people .on{background:#0090ff;color:#fff;border-color:#0090ff}#status{display:none;white-space:pre-line}article{padding:14px;background:#fff;margin:10px 0;border-radius:14px;border:1px solid #e2e8f2;box-shadow:0 2px 8px rgba(30,50,90,.07);cursor:pointer}article h2{margin:0 0 6px;color:#25355c}article p{margin:0 0 10px;color:#5b6b85;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.keybadge{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:28px;padding:0 7px;margin-left:14px;background:#ddd6fe;color:#5b21b6;border-radius:8px;font-weight:bold;font-size:16px;box-shadow:0 1px 4px rgba(124,58,237,.18)}#manager,#editor{display:none;background:#fff;border:1px solid #e2e8f2;border-radius:14px;padding:14px;margin:10px 0}h2{color:#4b3ba8}label{display:block;margin:10px 0}a{color:#0b6f8f}p{line-height:1.5}.muted{color:#6b7a92;font-size:16px}#viewer{display:none;position:fixed;top:0;bottom:0;left:0;right:0;background:#111827;z-index:30;overflow:hidden}#bar{position:absolute;top:0;left:0;right:0;z-index:6;padding:8px;background:linear-gradient(90deg,rgba(106,61,245,.96),rgba(0,144,255,.96));color:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap}#bar.hidden{display:none}#bar button,#bar select,#bar a{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4)}#tabs{max-width:36%}#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#111827;overflow:auto;padding:10px}#stage canvas{display:block;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.45)}#stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;z-index:3;background:rgba(17,24,39,.88);font-size:20px;text-align:center;padding:20px}#loading.off{display:none}#download{display:block;padding:10px}.artist{margin:8px 0;display:flex;gap:8px}.artist input{flex:1}.artist select{width:38%}#list:empty::after{content:"目前沒有歌譜。閱讀者請按「更新歌譜」。";display:block;padding:20px;color:#6b7a92}#fallback{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:#111827;padding:24px}#fallback.on{display:flex}#fallbackBox{background:#fff;color:#17233a;padding:22px;border-radius:16px;max-width:520px;text-align:center}#fallbackBox button{background:#6a3df5;color:#fff;border:0;padding:14px 18px;font-size:20px;margin-top:14px}</style><body><header><div id="toprow"><h1>千愛歌譜 <span class="ver">Version 0.17</span></h1><span class="spacer"></span><button id="update">更新歌譜</button><button id="manage">管理模式</button><button id="minus">A−</button><button id="plus">A＋</button></div><input id="search" type="text" placeholder="搜尋歌名／歌手"><div id="cats"></div><div id="people"></div></header><main><div id="status">程式尚未啟動。</div><section id="manager"><h2>新 iPad 管理</h2><p class="muted">編輯只改本機，不會直接更改網站。匯出完整發佈ZIP後，需由網站擁有者登入Netlify更新部署。</p><button id="importOld">讀取本機0.3歌譜</button><button id="add">＋ 加入歌譜</button><button id="publish">匯出完整發佈ZIP</button><button id="backup">備份資料JSON</button><label>還原0.3／0.4備份<input id="restore" type="file" accept=".json"></label><a id="saveLink" style="display:none">下載</a></section><section id="editor"><h2>加入／編輯</h2><label>PDF／JPG（多選為同一首的附件）<input id="files" type="file" multiple></label><label>歌名<input id="title" type="text"></label><label>語言<select id="language"><option>中文</option><option>英文歌</option><option>其他語言歌</option><option>其他</option></select></label><div id="artists"></div><button id="addArtist">＋ 歌手／樂隊</button><label>Key <select id="key"><option value="">不標記</option></select><select id="minor"><option value="">大調</option><option value="m">Minor</option></select></label><label><input id="duet" type="checkbox">合唱歌</label><button id="save">儲存到本機草稿</button><button id="cancel">取消</button></section><div id="list"></div></main><div id="viewer"><div id="loading" class="off">正在開啟歌譜…</div><div id="bar" class="hidden"><button id="back">返回</button><select id="tabs"></select><button id="close">× 關閉此譜</button><button id="prev">◀ 上一頁</button><button id="next">下一頁 ▶</button><span id="position"></span><button id="share">分享</button><button id="hidebar">隱藏工具列</button><a id="download" target="_blank">開啟原檔</a></div><div id="stage"></div><div id="fallback"><div id="fallbackBox"><h2>此iPad未能內嵌顯示PDF</h2><p>可改用Safari直接開啟這份PDF。Safari可正常顯示中文字及翻頁。</p><button id="openSameTab">直接開啟PDF</button><p class="muted">看完後按Safari左上角「返回」，即可回到歌譜庫。</p></div></div></div><script>window.onerror=function(m,s,l){var e=document.getElementById('status');e.style.display='block';e.textContent='錯誤：'+m+'，行 '+l;};</script><script src="app.js" onerror="var e=document.getElementById('status');e.style.display='block';e.textContent='app.js載入失敗'"></script></body></html>
